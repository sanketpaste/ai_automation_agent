<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dummy App</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 32px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #38bdf8; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #0284c7; color: white; font-weight: bold; cursor: pointer; margin-top: 8px; }
        button:hover { background: #0369a1; }
        .alert { padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; display: none; }
        .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
        .footer-link { text-align: center; margin-top: 16px; font-size: 13px; color: #94a3b8; }
        .footer-link a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Welcome Back</h2>
        <div id="login-error" data-testid="login-error" class="alert alert-error"></div>
        
        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" data-testid="login-username" placeholder="demo or demo@test.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" data-testid="login-password">
            </div>
            <button type="submit" id="login-submit" data-testid="login-submit">Login</button>
        </form>
        <div class="footer-link">
            Need an account? <a href="/register">Register here</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errEl = document.getElementById('login-error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errEl.style.display = 'none';

            const payload = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (!res.ok || !data.success) {
                    errEl.textContent = data.error || 'Invalid credentials';
                    errEl.style.display = 'block';
                } else {
                    window.location.href = data.redirect || '/profile';
                }
            } catch (err) {
                errEl.textContent = 'Network error during login';
                errEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
