<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Dummy App</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 32px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #38bdf8; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #0284c7; color: white; font-weight: bold; cursor: pointer; margin-top: 8px; }
        button:hover { background: #0369a1; }
        .alert { padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; display: none; }
        .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
        .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #6ee7b7; }
        .footer-link { text-align: center; margin-top: 16px; font-size: 13px; color: #94a3b8; }
        .footer-link a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create Account</h2>
        <div id="reg-error" data-testid="reg-error" class="alert alert-error"></div>
        <div id="reg-success" data-testid="reg-success" class="alert alert-success"></div>
        
        <form id="reg-form" novalidate>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" data-testid="reg-name" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" data-testid="reg-email" placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" data-testid="reg-phone" placeholder="1234567890">
            </div>
            <div class="form-group">
                <label for="password">Password (min 8 chars)</label>
                <input type="password" id="password" data-testid="reg-password">
            </div>
            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" data-testid="reg-confirm">
            </div>
            <button type="submit" id="reg-submit" data-testid="reg-submit">Register</button>
        </form>
        <div class="footer-link">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('reg-form');
        const errEl = document.getElementById('reg-error');
        const succEl = document.getElementById('reg-success');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errEl.style.display = 'none';
            succEl.style.display = 'none';

            const payload = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                password: document.getElementById('password').value,
                confirm: document.getElementById('confirm').value
            };

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (!res.ok || !data.success) {
                    errEl.textContent = data.error || 'Registration failed';
                    errEl.style.display = 'block';
                } else {
                    succEl.textContent = data.message || 'Registration successful! You can now login.';
                    succEl.style.display = 'block';
                    form.reset();
                }
            } catch (err) {
                errEl.textContent = 'Network error during registration';
                errEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
